<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Paiement">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style2.css">
    <title>Primvo - Paiement Sécurisé</title>
    <div class="checkout-page px-3">
        <div class="checkout-header">
            <h2>Paiement Sécurisé</h2>
        </div>

        <div class="row g-5">
            <div class="col-md-7">
                <div class="checkout-card">
                    <h3><i class="fa fa-file-invoice"></i> Détails de facturation</h3>
                    <form id="checkout-form" onsubmit="event.preventDefault(); showSuccess();">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label>Prénom</label>
                                <input type="text" class="form-control" placeholder="Jean" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>Nom</label>
                                <input type="text" class="form-control" placeholder="Dupont" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label>Email</label>
                            <input type="email" class="form-control" placeholder="jean.dupont@email.com" required>
                        </div>
                        <div class="mb-3">
                            <label>Adresse de livraison</label>
                            <input type="text" class="form-control" placeholder="123 Rue de la Paix" required>
                        </div>
                        <div class="row mb-4">
                            <div class="col-md-6 mb-3">
                                <label>Ville</label>
                                <input type="text" class="form-control" placeholder="Cotonou" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>Code Postal</label>
                                <input type="text" class="form-control" placeholder="00000" required>
                            </div>
                        </div>

                        <h3><i class="fa fa-wallet"></i> Méthode de paiement</h3>
                        
                        <div class="payment-methods-grid">
                            <label class="payment-method-card active" onclick="selectPayment(this)">
                                <input type="radio" name="paymentMethod" value="mtn" checked style="display:none;">
                                <i class="fa fa-mobile-alt" style="color: #ffcc00;"></i>
                                <span>MTN Mobile Money</span>
                            </label>

                            <label class="payment-method-card" onclick="selectPayment(this)">
                                <input type="radio" name="paymentMethod" value="moov" style="display:none;">
                                <i class="fa fa-mobile-alt" style="color: #0055a4;"></i>
                                <span>MOOV Money</span>
                            </label>

                            <label class="payment-method-card" onclick="selectPayment(this)">
                                <input type="radio" name="paymentMethod" value="celtis" style="display:none;">
                                <i class="fa fa-mobile-alt" style="color: #e50000;"></i>
                                <span>Celtis Cash</span>
                            </label>

                            <label class="payment-method-card" onclick="selectPayment(this)">
                                <input type="radio" name="paymentMethod" value="card" style="display:none;">
                                <i class="fa fa-credit-card" style="color: #333;"></i>
                                <span>Carte Bancaire</span>
                            </label>
                        </div>

                        <div class="mb-4">
                            <label>Numéro de compte / Carte</label>
                            <input type="text" class="form-control" placeholder="XXXX-XXXX-XXXX-XXXX" required>
                        </div>

                        <button type="submit" class="btn-premium" id="btn-submit-pay">Confirmer la commande</button>
                    </form>
                </div>
            </div>
            
            <div class="col-md-5">
                <div class="order-summary-sticky">
                    <div class="checkout-card" style="background: #fafafa;">
                        <h3><i class="fa fa-shopping-bag"></i> Résumé</h3>
                        <div id="order-items" style="margin-bottom: 20px;">
                            <!-- Rempli dynamiquement -->
                        </div>
                        <div class="summary-item">
                            <span>Sous-total</span>
                            <span id="order-subtotal" class="fw-bold">0 FCFA</span>
                        </div>
                        <div class="summary-item">
                            <span>Frais de livraison</span>
                            <span>2.000 FCFA</span>
                        </div>
                        <div class="summary-total">
                            <span>Total à payer</span>
                            <span id="order-total" style="color: #ff8c00;">0 FCFA</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SUCCESS MODAL PREMIUM -->
    <div class="success-modal-overlay" id="successModal">
        <div class="success-modal-card">
            <div class="success-icon-wrap">
                <i class="fa fa-check"></i>
            </div>
            <h2>Paiement Réussi !</h2>
            <p>Merci pour votre achat. Votre commande a été traitée avec succès et est en cours de préparation.</p>
            <button class="btn-premium" onclick="window.location.href='../index.html'">Retour à l'accueil</button>
        </div>
    </div>

    <script>
        // Remplir le résumé depuis localStorage
        (function loadCartSummary() {
            const DELIVERY = 2000;
            try {
                const cart = JSON.parse(localStorage.getItem('primvo_cart') || '[]');
                const itemsEl    = document.getElementById('order-items');
                const subtotalEl = document.getElementById('order-subtotal');
                const totalEl    = document.getElementById('order-total');
                const payBtn     = document.querySelector('.btn-pay');

                if (!itemsEl) return;

                if (cart.length === 0) {
                    itemsEl.innerHTML = '<p class="text-muted text-center py-3">Panier vide — <a href="../index.html">Retour boutique</a></p>';
                    if (payBtn) payBtn.disabled = true;
                    return;
                }

                let subtotal = 0;
                itemsEl.innerHTML = cart.map(item => {
                    const lineTotal = (parseInt(item.price)||0) * (parseInt(item.quantity)||1);
                    subtotal += lineTotal;
                    return `<div class="d-flex justify-content-between mb-2">
                        <span>${item.name} (x${item.quantity||1})</span>
                        <span>${lineTotal.toLocaleString('fr-FR')} FCFA</span>
                    </div>`;
                }).join('');

                subtotalEl.textContent = subtotal.toLocaleString('fr-FR') + ' FCFA';
                totalEl.textContent    = (subtotal + DELIVERY).toLocaleString('fr-FR') + ' FCFA';
                if (payBtn) payBtn.textContent = `Confirmer la commande (${(subtotal+DELIVERY).toLocaleString('fr-FR')} FCFA)`;
            } catch(e) { console.warn('Cart load error:', e); }
        })();

        // Confirmation paiement
        function showSuccess() {
            // Vider le panier après paiement réussi
            localStorage.removeItem('primvo_cart');
            document.getElementById('successModal').style.display = 'flex';
        }

        function openmenu(){
            const m=document.getElementById('side-menu');
            if(m) m.classList.add('open');
        }
        function closemenu(){
            const m=document.getElementById('side-menu');
            if(m) m.classList.remove('open');
        }

        // Gestion de la sélection de la méthode de paiement
        function selectPayment(element) {
            document.querySelectorAll('.payment-method-card').forEach(card => {
                card.classList.remove('active');
            });
            element.classList.add('active');
            element.querySelector('input[type="radio"]').checked = true;
        }
    </script>
</body>
</html>
