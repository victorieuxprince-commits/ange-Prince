<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails du Produit - Primvo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style2.css">
</head>
<body class="bg-light">

    <div class="container my-5">
        <div id="product-detail-container" class="row g-5">
            <!-- Injecté par JS -->
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Chargement...</span>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { getProductFromUrl } from '../js/products.js';
        import { cartManager } from '../js/cart.js';
        import { showToast } from '../js/ui.js';

        const container = document.getElementById('product-detail-container');

        function renderDetails() {
            const product = getProductFromUrl();

            if (!product) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="fa fa-exclamation-triangle fa-4x text-warning mb-3"></i>
                        <h3>Produit non trouvé</h3>
                        <a href="../index.html" class="btn btn-primary mt-3">Retour à l'accueil</a>
                    </div>
                `;
                return;
            }

            // Update page title
            document.title = `${product.name} - Primvo`;

            container.innerHTML = `
                <div class="col-md-6">
                    <div class="product-image-card reveal active">
                        <img src="../${product.image}" class="img-fluid rounded-4 shadow" alt="${product.name}">
                    </div>
                </div>
                <div class="col-md-6 reveal active">
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a href="../index.html">Accueil</a></li>
                            <li class="breadcrumb-item"><a href="${product.category.toLowerCase()}.html">${product.category}</a></li>
                            <li class="breadcrumb-item active">${product.name}</li>
                        </ol>
                    </nav>
                    <h1 class="display-4 fw-bold mb-2">${product.name}</h1>
                    <div class="stars mb-3 text-orange">
                        <i class="fa fa-star"></i><i class="fa fa-star"></i><i class="fa fa-star"></i><i class="fa fa-star"></i><i class="fa fa-star-half-o"></i>
                        <span class="text-muted ms-2">(4.5/5)</span>
                    </div>
                    <div class="h2 text-orange fw-bold mb-4">${product.price.toLocaleString()} FCFA</div>
                    
                    <p class="text-muted mb-4 fs-5" style="line-height: 1.8;">${product.description}</p>
                    
                    <div class="d-flex gap-3 mb-5">
                        <div class="p-3 bg-white rounded-3 shadow-sm flex-fill text-center border">
                            <small class="text-muted d-block">Stock</small>
                            <strong>${product.stock > 0 ? product.stock + ' unités' : 'Rupture'}</strong>
                        </div>
                        <div class="p-3 bg-white rounded-3 shadow-sm flex-fill text-center border">
                            <small class="text-muted d-block">Livraison</small>
                            <strong>Gratuite</strong>
                        </div>
                    </div>

                    <div class="d-grid gap-3">
                        <button class="btn btn-orange btn-lg py-3 rounded-pill fw-bold" id="add-to-cart-btn">
                            <i class="fa fa-shopping-cart me-2"></i> AJOUTER AU PANIER
                        </button>
                        <button class="btn btn-dark btn-lg py-3 rounded-pill fw-bold">
                            ACHETER MAINTENANT
                        </button>
                    </div>
                </div>
            `;

            document.getElementById('add-to-cart-btn').addEventListener('click', () => {
                cartManager.addItem(product);
                showToast(`${product.name} ajouté au panier !`);
            });
        }

        renderDetails();
    </script>
</body>
</html>
