<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style2.css">
    <title>Primvo - Connexion</title>
    <div class="auth-page-wrapper">
        <!-- Section Image Branding -->
        <div class="auth-image-side">
            <h1>Bon retour parmi nous</h1>
            <p>Connectez-vous pour finaliser vos achats et découvrir nos nouvelles collections.</p>
        </div>

        <!-- Section Formulaire -->
        <div class="auth-form-side">
            <a href="../index.html" class="back-to-home"><i class="fa fa-arrow-left"></i> Retour</a>
            
            <div class="auth-glass-card">
                <h2>Connexion</h2>
                <form onsubmit="event.preventDefault(); window.location.href='../index.html';">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" placeholder="exemple@email.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mot de passe</label>
                        <input type="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-premium">Se connecter</button>
                    <a href="inscription.html" class="auth-link">Pas encore de compte ? <span>S'inscrire</span></a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
