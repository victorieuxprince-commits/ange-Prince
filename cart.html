<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Panier - Primvo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/all.min.css">
    <link rel="stylesheet" href="./css/style2.css">
    <link rel="stylesheet" href="./css/cart.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">

    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2"><i class="fa fa-shopping-cart text-primary"></i> Votre Panier</h1>
            <a href="index.html" class="btn btn-outline-secondary btn-sm"><i class="fa fa-arrow-left"></i> Continuer les achats</a>
        </div>

        <div class="row g-4">
            <!-- Liste des articles -->
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                    <div class="card-body p-0">
                        <table class="table table-hover align-middle mb-0" id="cart-table">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-4">Produit</th>
                                    <th>Prix</th>
                                    <th>Quantité</th>
                                    <th>Sous-total</th>
                                    <th class="text-center">Action</th>
                                </tr>
                            </thead>
                            <tbody id="cart-items">
                                <!-- Injecté par JS -->
                            </tbody>
                        </table>
                        <div id="empty-cart-msg" class="text-center py-5 d-none">
                            <i class="fa fa-shopping-basket fa-4x text-muted mb-3"></i>
                            <p class="text-muted">Votre panier est vide.</p>
                            <a href="index.html" class="btn btn-primary px-4">Découvrir nos produits</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Résumé de la commande -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4">
                        <h5 class="card-title mb-4">Résumé</h5>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Sous-total</span>
                            <span class="fw-bold" id="subtotal">0 FCFA</span>
                        </div>
                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-muted">Livraison</span>
                            <span class="text-success fw-bold">Gratuite</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between mb-4">
                            <span class="h5">Total</span>
                            <span class="h5 text-primary fw-bold" id="total">0 FCFA</span>
                        </div>
                        <button class="btn btn-primary w-100 py-3 rounded-3 fw-bold mb-2" id="checkout-btn"
                                onclick="handleCheckout()">
                            <i class="fa fa-lock me-2"></i> PROCÉDER AU PAIEMENT
                        </button>
                        <button class="btn btn-outline-secondary w-100 py-2 rounded-3 btn-sm" onclick="location.reload()">
                            <i class="fa fa-sync"></i> Actualiser le panier
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { cartManager } from './js/cart.js';

        const cartItems = document.getElementById('cart-items');
        const emptyMsg = document.getElementById('empty-cart-msg');
        const totalEl = document.getElementById('total');
        const subtotalEl = document.getElementById('subtotal');

        /**
         * Rendu du panier avec rafraîchissement DOM immédiat
         */
        function renderCart(items) {
            if (!items || items.length === 0) {
                cartItems.innerHTML = '';
                emptyMsg.classList.remove('d-none');
                totalEl.textContent = '0 FCFA';
                subtotalEl.textContent = '0 FCFA';
                return;
            }

            emptyMsg.classList.add('d-none');
            
            cartItems.innerHTML = items.map(item => `
                <tr class="reveal active">
                    <td class="ps-4 py-4">
                        <div class="d-flex align-items-center">
                            <img src="${item.image}"
                                 alt="${item.name}"
                                 class="rounded-4 shadow-sm me-3"
                                 style="width: 80px; height: 80px; object-fit: cover;"
                                 onerror="this.src='https://via.placeholder.com/80x80?text=Produit'">
                            <div>
                                <h6 class="mb-1 fw-bold">${item.name}</h6>
                                <span class="badge bg-light text-dark border">${item.category || 'Produit'}</span>
                            </div>
                        </div>
                    </td>
                    <td class="fw-medium">${(parseFloat(item.price) || 0).toLocaleString()} FCFA</td>
                    <td>
                        <div class="d-flex align-items-center bg-light rounded-pill p-1" style="width: fit-content;">
                            <button class="btn btn-sm btn-white rounded-circle shadow-sm" onclick="updateQty('${item.id}', ${parseInt(item.quantity) - 1})">
                                <i class="fa fa-minus"></i>
                            </button>
                            <span class="px-3 fw-bold">${item.quantity}</span>
                            <button class="btn btn-sm btn-white rounded-circle shadow-sm" onclick="updateQty('${item.id}', ${parseInt(item.quantity) + 1})">
                                <i class="fa fa-plus"></i>
                            </button>
                        </div>
                    </td>
                    <td class="fw-bold text-orange">${((parseFloat(item.price) || 0) * (parseInt(item.quantity) || 0)).toLocaleString()} FCFA</td>
                    <td class="text-center">
                        <button class="btn btn-outline-danger btn-sm rounded-circle" onclick="removeItem('${item.id}')">
                            <i class="fa fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');

            const total = cartManager.getTotal();
            totalEl.textContent = `${total.toLocaleString()} FCFA`;
            subtotalEl.textContent = `${total.toLocaleString()} FCFA`;
        }

        window.updateQty = (id, qty) => {
            if (qty <= 0) {
                if (confirm("Retirer cet article ?")) cartManager.removeItem(id);
            } else {
                cartManager.updateQuantity(id, qty);
            }
        };
        
        window.removeItem = (id) => {
            if (confirm("Supprimer cet article ?")) cartManager.removeItem(id);
        };

        // Bouton paiement
        window.handleCheckout = () => {
            if (!cartManager.cart || cartManager.cart.length === 0) {
                alert('Votre panier est vide. Ajoutez des produits avant de payer.');
            } else {
                window.location.href = './page/paiement.html';
            }
        };

        // Souscription pour mise à jour automatique du DOM
        cartManager.subscribe(renderCart);
    </script>

    <!-- Toast notifications -->
    <div id="toast-container"></div>

</body>
</html>
